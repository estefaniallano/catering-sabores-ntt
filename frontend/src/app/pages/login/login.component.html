<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="text-center mb-4">
        <h1 class="page-title h3 mb-1">Acceso</h1>
        <p class="text-muted mb-0">Catering Sabores de Casa</p>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form class="d-grid gap-3" autocomplete="off">
            <div>
              <label class="form-label" for="email">Email</label>
              <input
                id="email"
                type="email"
                class="form-control"
                placeholder="nombre@empresa.com"
              />
            </div>

            <div>
              <label class="form-label" for="password">Contraseña</label>
              <input
                id="password"
                type="password"
                class="form-control"
                placeholder="••••••••"
              />
            </div>

            <button type="button" class="btn btn-primary btn-lg">
              Entrar
            </button>

            <div class="d-flex justify-content-between small text-muted">
              <span>Rol demo</span>
              <span class="d-flex gap-2">
                <a class="link-secondary" routerLink="/comercial/eventos">Comercial</a>
                <span>·</span>
                <a class="link-secondary" routerLink="/cocina/dashboard">Cocina</a>
              </span>
            </div>
          </form>
        </div>
      </div>

      <p class="text-center text-muted small mt-3 mb-0">
        Responsive (escritorio/tablet)
      </p>
    </div>
  </div>
</div>
