<div class="container">
  <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-3">
    <div>
      <h1 class="page-title h4 mb-1">Eventos (Comercial)</h1>
      <p class="text-muted mb-0">Listado operativo y seguimiento</p>
    </div>

    <div class="d-flex flex-column flex-sm-row gap-2">
      <input class="form-control" type="search" placeholder="Buscar cliente / ubicación..." />
      <select class="form-select">
        <option selected>Todos</option>
        <option>Confirmados</option>
        <option>En preparación</option>
        <option>Cancelados</option>
      </select>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-lg-6" *ngFor="let e of eventos">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start gap-2">
            <div>
              <h2 class="h6 mb-1">{{ e.titulo }}</h2>
              <div class="text-muted small">
                <span class="me-2">{{ e.fecha }}</span>
                <span>·</span>
                <span class="ms-2">{{ e.ubicacion }}</span>
              </div>
            </div>

            <span class="badge" [ngClass]="e.badgeClass">{{ e.estado }}</span>
          </div>

          <hr />

          <div class="d-flex flex-wrap gap-3 small">
            <div><span class="text-muted">Cliente:</span> {{ e.cliente }}</div>
            <div><span class="text-muted">Comensales:</span> {{ e.comensales }}</div>
            <div><span class="text-muted">Tipo:</span> {{ e.tipo }}</div>
          </div>
        </div>

        <div class="card-footer bg-white border-0 pt-0">
          <div class="d-grid d-sm-flex gap-2 justify-content-sm-end">
            <button class="btn btn-outline-secondary btn-sm" type="button">Ver detalle</button>
            <button class="btn btn-primary btn-sm" type="button">Editar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="alert alert-info mt-4 mb-0">
    Vista demo (sin API). En el stack final se consumirá <code>GET /api/v1/eventos</code>.
  </div>
</div>
